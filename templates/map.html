<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
{{LEAFLET_CSS}}
<style>
{{MAP_CSS}}
</style>
</head>
<body>
<div class="container">

<header>
  <div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUBTITLE}}</div>
  </div>
</header>

<div class="map-section" id="map-section">
  <div id="map"></div>
  <button id="fullscreen-btn" type="button" aria-label="全屏浏览地图" title="全屏浏览">⛶</button>
  <button id="focus-btn" type="button" aria-pressed="false">聚焦河谷</button>
  <div id="layer-switch" role="group" aria-label="地图图层">
    <button class="ls-btn active" type="button" data-layer="standard" aria-pressed="true">标准</button>
    <button class="ls-btn" type="button" data-layer="terrain" aria-pressed="false">地形</button>
  </div>
  <div id="zoom-display">Zoom 5</div>
</div>

<div class="route-map">
  <div class="route-stops">
{{SIDEBAR_HTML}}
  </div>
</div>

<h2 style="font-size:18px;font-weight:700;margin-bottom:16px;color:#94a3b8;">📋 每日详情</h2>
<div class="day-cards">
{{CARDS_HTML}}
</div>

<div class="footer">{{FOOTER_HTML}}</div>
</div>

{{LEAFLET_JS}}
<script>
// ═══════════════════ Route Data ═══════════════════
{{ROUTE_JS}}
// ═══════════════════════════════════════════════════
{{MAP_JS}}
</script>
</body>
</html>
